<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1117;
      color: #f0f2f8;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .icon {
      font-size: 24px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 11px;
      color: #9ba3be;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #9ba3be;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #313647;
      background: #1a1d27;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
    }
    .btn:hover {
      background: #2563eb;
    }
    .footer-note {
      margin-top: 10px;
      font-size: 10px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">💻</div>
    <div>
      <h2>RemoteDesk</h2>
      <div class="subtitle">Unattended Windows Access</div>
    </div>
  </div>

  <div class="field">
    <label for="relayUrl">Relay Server URL</label>
    <input type="text" id="relayUrl" placeholder="ws://localhost:8000 or wss://...">
  </div>

  <div class="field">
    <label for="deviceId">Device ID</label>
    <input type="text" id="deviceId" value="windows-laptop">
  </div>

  <div class="field">
    <label for="pin">Secret PIN</label>
    <input type="password" id="pin" value="123456">
  </div>

  <button class="btn" id="btnConnect">🚀 Launch Remote Control</button>
  <div class="footer-note">Access your Windows machine anytime it's online</div>

  <script src="popup.js"></script>
</body>
</html>
